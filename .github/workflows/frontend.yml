name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend-app

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/frontend-app/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
      - run: npm run test:e2e:install -- --with-deps
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-browser-results
          path: |
            frontend-app/test-results
            frontend-app/playwright-report
          retention-days: 7
