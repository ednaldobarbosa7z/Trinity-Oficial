services:
  db:
    image: postgres:15
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-trinity_local}
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend-api
    restart: always
    volumes:
      - api_storage:/app/storage
      - api_tmp:/app/tmp
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-trinity_local}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/up')).is_a?(Net::HTTPSuccess) ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  jobs:
    build: ./backend-api
    restart: always
    init: true
    command: ["bundle", "exec", "ruby", "bin/jobs"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-trinity_local}
    healthcheck:
      test: ["CMD", "bundle", "exec", "rails", "runner", "exit(SolidQueue::Process.where('last_heartbeat_at > ?', 2.minutes.ago).exists? ? 0 : 1)"]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 5

  web:
    build: ./frontend-app
    restart: always
    ports:
      - "127.0.0.1:4200:4200"
    depends_on:
      api:
        condition: service_healthy
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      NG_CLI_ANALYTICS: "false"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 12

volumes:
  postgres_data:
  api_storage:
  api_tmp:
