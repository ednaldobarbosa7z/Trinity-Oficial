<div class="login-container">
  <div class="login-card">

    <div class="header">
      <div class="logo-wrapper">
        <img src="logo.png" alt="Clube Filme Logo" class="login-logo">
      </div>
    </div>

    <form (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label>E-mail</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="seu@email.com" required>
      </div>

      <div class="form-group">
        <label>Senha</label>
        <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" required>
      </div>

      <div class="error-msg" *ngIf="errorMessage">
        ⚠️ {{ errorMessage }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading">
        {{ isLoading ? 'Entrando...' : 'Entrar' }}
      </button>

    </form>

    <div class="footer">
      <p>Ainda não tem conta? <a routerLink="/register">Crie uma agora</a></p>
    </div>

  </div>
</div>
