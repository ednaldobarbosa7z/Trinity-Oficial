<app-auth-layout>
  <span class="eyebrow">Bem-vindo de volta</span>
  <h1>Seu lugar na sessão.</h1>
  <p class="lead">Entre para acompanhar as indicações e as conversas do seu clube.</p>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate [attr.aria-busy]="loading()">
    @if (error()) {
      <p class="form-error" role="alert">{{ error() }}</p>
    }
    <div class="field">
      <label for="login-email">Email</label>
      <input
        id="login-email"
        type="email"
        formControlName="email"
        autocomplete="username"
        placeholder="voce@exemplo.com"
        [attr.aria-invalid]="form.controls.email.invalid && form.controls.email.touched"
        aria-describedby="login-email-error"
        required
      />
      <app-field-error [control]="form.controls.email" id="login-email-error" />
    </div>
    <div class="field">
      <label for="login-password">Senha</label>
      <div class="password-field">
        <input
          id="login-password"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          placeholder="Sua senha"
          aria-describedby="login-password-error"
          required
        />
        <button
          type="button"
          class="password-toggle"
          [attr.aria-pressed]="showPassword()"
          (click)="showPassword.set(!showPassword())"
        >
          {{ showPassword() ? 'Ocultar' : 'Mostrar' }}
        </button>
      </div>
      <app-field-error [control]="form.controls.password" id="login-password-error" />
    </div>
    <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
      @if (loading()) {
        <span class="spinner small"></span>
      }
      {{ loading() ? 'Entrando…' : 'Entrar no clube' }} <app-icon name="arrow" [size]="17" />
    </button>
  </form>
  <p class="form-footer">Ainda não faz parte? <a routerLink="/register">Crie sua conta</a></p>
</app-auth-layout>
