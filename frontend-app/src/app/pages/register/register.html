<div class="register-container">

  <div class="register-card">

    <div class="header">
      <div class="logo-wrapper">
        <img src="logo.png" alt="Clube Filme Logo" class="register-logo">
      </div>
      <h2>Criar Conta</h2>
    </div>

    <form (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label>Nome Completo</label>
        <input type="text" [(ngModel)]="user.nome" name="nome" placeholder="Ex: João Silva" required>
      </div>

      <div class="form-group">
        <label>Nickname (Apelido)</label>
        <input type="text" [(ngModel)]="user.nickname" name="nickname" placeholder="Ex: cinefilo99" required>
      </div>

      <div class="form-group">
        <label>E-mail</label>
        <input type="email" [(ngModel)]="user.email" name="email" placeholder="seu@email.com" required>
      </div>

      <div class="form-group">
        <label>Senha</label>
        <input type="password" [(ngModel)]="user.password" name="password" placeholder="••••••••" required>
      </div>

      <div class="error-msg" *ngIf="errorMessage">
        ⚠️ {{ errorMessage }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading">
        {{ isLoading ? 'Criando conta...' : 'Cadastrar' }}
      </button>

    </form>

    <div class="footer">
      <p>Já tem conta? <a routerLink="/login">Faça Login</a></p>
    </div>

  </div>
</div>
